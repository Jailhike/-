<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Companion</title>
<style>
:root{--bg:#100e14;--card:#1c1824;--pink:#f06bb8;--text:#f2eef6;--mut:#9a92a8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
#main{flex:1;overflow-y:auto;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card,.row{background:var(--card);border-radius:16px;padding:14px;cursor:pointer}
.card .em{font-size:56px;text-align:center}
.card b{display:block;margin-top:6px}.card small,.row small{color:var(--mut)}
.row{display:flex;gap:12px;align-items:center;margin-bottom:8px}.row .em{font-size:34px}
nav{display:flex;justify-content:space-around;padding:10px;background:var(--card)}
nav button{background:none;border:0;color:var(--mut);font-size:15px}nav .on{color:var(--pink)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar{flex:1;height:6px;background:#3a3446;border-radius:3px}.bar i{display:block;height:100%;background:var(--pink);border-radius:3px}
.msgs{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.m{max-width:80%;padding:9px 12px;border-radius:14px;background:var(--card);white-space:pre-wrap}
.m.user{align-self:flex-end;background:#6f3f66}
#inp{display:flex;gap:8px;padding:8px}#inp input{flex:1;padding:12px;border-radius:20px;border:0;background:var(--card);color:var(--text)}
#inp button{background:var(--pink);border:0;border-radius:20px;padding:0 18px;color:#fff}
.lim{background:var(--card);border-radius:12px;padding:10px;text-align:center;color:var(--mut);margin:6px 8px}
</style></head>
<body>
<div id="main"></div>
<div id="inp" style="display:none"><input id="t" placeholder="Сообщение" autocomplete="off"><button id="send">➤</button></div>
<nav id="nav"><button data-v="home" class="on">Главная</button><button data-v="chats">Чаты</button><button data-v="me">Профиль</button></nav>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const H={'X-Init':tg.initData,'Content-Type':'application/json'};
const $=s=>document.querySelector(s),main=$('#main');
let chars=[],left=0,cur=null;
const api=(p,o)=>fetch('/api/'+p,{headers:H,...o}).then(r=>{if(!r.ok)throw r;return r.json()});
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function load(){const d=await api('chars');chars=d.chars;left=d.left}
function view(v){
  cur=null;$('#inp').style.display='none';$('#nav').style.display='flex';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));
  if(v=='home')main.innerHTML='<div class="grid">'+chars.map(c=>`<div class="card" data-c="${c.id}"><div class="em">${c.emoji}</div><b>${c.name}</b><small>${c.bio}</small></div>`).join('')+'</div>';
  if(v=='chats')main.innerHTML=chars.slice().sort((a,b)=>b.ts-a.ts).map(c=>`<div class="row" data-c="${c.id}"><div class="em">${c.emoji}</div><div><b>${c.name}</b><br><small>${esc(c.last||'Начать диалог')}</small></div></div>`).join('');
  if(v=='me')main.innerHTML=`<div class="lim">Сообщений осталось сегодня: ${left}</div>`;
  main.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>openChat(e.dataset.c));
}
function bubble(role,text){const d=document.createElement('div');d.className='m '+(role=='user'?'user':'');d.textContent=text;$('.msgs').appendChild(d);main.scrollTop=main.scrollHeight;return d}
function hud(lv,pr,l){left=l;$('#lv').textContent='Ур. '+lv;$('#pr').style.width=(pr*100)+'%';$('#lim').textContent=l>0?`Осталось сообщений: ${l}`:'Лимит на сегодня исчерпан, возвращайся завтра'}
async function openChat(id){
  cur=id;const c=chars.find(x=>x.id==id);$('#nav').style.display='none';$('#inp').style.display='flex';
  main.innerHTML=`<div class="top"><button onclick="view('home')" style="background:none;border:0;color:#fff;font-size:20px">‹</button><b>${c.emoji} ${c.name}</b><span id="lv"></span><div class="bar"><i id="pr"></i></div></div><div class="msgs"></div><div class="lim" id="lim"></div>`;
  const h=await api('history/'+id);h.msgs.forEach(m=>bubble(m.role,m.text));hud(h.level,h.progress,h.left);
}
async function send(){
  const t=$('#t').value.trim();if(!t||!cur)return;$('#t').value='';bubble('user',t);const w=bubble('model','…');
  try{const d=await api('chat',{method:'POST',body:JSON.stringify({cid:cur,text:t})});w.textContent=d.reply;hud(d.level,d.progress,d.left);
    chars.find(x=>x.id==cur).last=d.reply;chars.find(x=>x.id==cur).ts=Date.now()}
  catch(e){w.textContent=e.status==429?'Лимит на сегодня исчерпан':'Ошибка, попробуй ещё раз'}
}
$('#send').onclick=send;$('#t').onkeydown=e=>{if(e.key=='Enter')send()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>view(b.dataset.v));
load().then(()=>view('home'));
</script></body></html>
